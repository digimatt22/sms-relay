services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: relayhub_sms_cluster_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: relayhub_sms
      RELAYHUB_DB_OWNER_PASSWORD: ${RELAYHUB_DB_OWNER_PASSWORD:?RELAYHUB_DB_OWNER_PASSWORD is required}
      RELAYHUB_DB_RUNTIME_PASSWORD: ${RELAYHUB_DB_RUNTIME_PASSWORD:?RELAYHUB_DB_RUNTIME_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - relayhub-postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/010-relayhub-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub_sms_owner -d relayhub_sms"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  relayhub-postgres:
